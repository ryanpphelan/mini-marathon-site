<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<script>
/* Redirect old Wix URLs to their new pages. GitHub Pages serves this 404
   page for any path with no matching file, so we map the old slugs here. */
(function(){
  var map={
    "/photo-albums":"/photos.html",
    "/press-media":"/press.html",
    "/about-5":"/about.html",
    "/resources":"/resources.html",
    "/general-5":"/register.html",
    "/general-8":"/volunteer.html"
  };
  var path=window.location.pathname.replace(/\/+$/,"");
  if(Object.prototype.hasOwnProperty.call(map,path)){
    window.location.replace(map[path]+window.location.search+window.location.hash);
  }
})();
</script>
