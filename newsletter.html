<meta name="robots" content="noindex, nofollow">
<title>Stay in the loop — 26.2 Step Mini Marathon</title>
<meta name="description" content="Sign up for 26.2 Step Mini Marathon updates: event news, new stories, and ways to help.">
<link rel="icon" href="assets/img/favicon-oval.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
.lp{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:44px 22px 52px;box-sizing:border-box}
.lp .accent{position:fixed;top:0;left:0;right:0;height:6px;display:flex}
.lp .accent i{flex:1}
.lp .logo{width:118px;height:auto;margin:0 auto 22px}
.lp h1{font-family:Poppins,sans-serif;font-weight:800;font-size:clamp(1.7rem,7vw,2.3rem);line-height:1.1;margin:0 0 12px;color:var(--ink)}
.lp .sub{color:var(--muted);max-width:24em;margin:0 auto 28px;font-size:1.06rem;line-height:1.5}
.lp form{width:100%;max-width:380px;margin:0 auto}
.lp .nlrow{display:flex;flex-direction:column;gap:10px}
.lp input[type=email]{padding:15px 16px;border:1px solid var(--line);border-radius:11px;font-size:1.05rem;width:100%;box-sizing:border-box}
.lp button{padding:15px 18px;border:0;border-radius:11px;font:700 1.08rem Inter,sans-serif;background:var(--gold);color:var(--ink);cursor:pointer}
.lp button:hover{filter:brightness(.97)}
.lp .nlmsg{margin-top:16px;color:var(--green);font-weight:600;font-size:1rem;line-height:1.5}
.lp .fine{color:var(--muted);font-size:.85rem;margin-top:14px;max-width:24em}
.lp .back{margin-top:30px;font-size:.95rem}
.lp .back a{color:var(--green);font-weight:600;text-decoration:none}
</style>
</head><body>
<main class="lp">
  <div class="accent"><i style="background:var(--magenta)"></i><i style="background:var(--purple)"></i><i style="background:var(--teal)"></i><i style="background:var(--blue)"></i><i style="background:var(--sky)"></i><i style="background:var(--gold)"></i></div>
  <img class="logo" src="assets/img/logo-oval.png" alt="26.2 Step Mini Marathon">
  <h1>Stay in the loop</h1>
  <p class="sub">Event news, new stories, and ways to help. A few times a year, and never any spam.</p>
  <form class="nlform" novalidate>
    <div class="nlrow">
      <input name="Email" type="email" placeholder="you@example.com" aria-label="Email address" autocomplete="email" required>
      <button type="submit">Sign me up</button>
    </div>
    <p class="nlmsg" style="display:none"></p>
  </form>
  <p class="fine">Double opt-in: we&rsquo;ll email you to confirm. Unsubscribe anytime.</p>
  <p class="back"><a href="index.html">Explore the full site &rarr;</a></p>
</main>
<script src="assets/js/main.js"></script>
